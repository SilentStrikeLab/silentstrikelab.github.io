<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#000000" stroke="url(#logoGradient)" stroke-width="2"/>

  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05f59b" />
      <stop offset="100%" stop-color="#00d4ff" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Shield Outline -->
  <path
    d="M100 30L50 55v45c0 37.5 25.5 72.5 50 80 24.5-7.5 50-42.5 50-80V55L100 30z"
    fill="none"
    stroke="url(#logoGradient)"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Lightning Bolt -->
  <path
    d="M107.5 55L75 100h30l-7.5 45L130 90h-30l7.5-35z"
    fill="url(#logoGradient)"
    filter="url(#glow)"
  />
</svg>
